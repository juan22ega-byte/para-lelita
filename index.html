<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lelita & Teban ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ffe6eb 0%, #ffd1dc 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #2c3e50;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #d63384;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #6c757d;
            margin-bottom: 20px;
            font-style: italic;
        }
        .carousel {
            position: relative;
            width: 100%;
            height: 350px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .carousel img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        .carousel img.active {
            opacity: 1;
        }
        .counter {
            background: #fff0f3;
            border: 2px solid #ffb3c1;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }
        .counter-title {
            font-weight: bold;
            color: #c77dff;
            margin-bottom: 8px;
        }
        .timer {
            font-size: 1.1em;
            font-weight: 600;
            color: #590d22;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lelita & Teban ❤️</h1>
        <p class="subtitle">Juntos en cada momento...</p>

        <div class="carousel">
            <img src="image.JPG.jpeg" class="active" alt="Foto 1">
            <img src="image_2.JPG.jpeg" alt="Foto 2">
            <img src="image_3.JPG.jpeg" alt="Foto 3">
            <img src="image_4.JPG.jpeg" alt="Foto 4">
            <img src="image_5.JPG.jpeg" alt="Foto 5">
            <img src="image_6.JPG.jpeg" alt="Foto 6">
            <img src="image_7.JPG.jpeg" alt="Foto 7">
            <img src="image_8.JPG.jpeg" alt="Foto 8">
            <img src="image_9.JPG.jpeg" alt="Foto 9">
            <img src="image_10.JPG.jpeg" alt="Foto 10">
        </div>

        <div class="counter">
            <div class="counter-title">Tiempo juntos 💕</div>
            <div id="timer" class="timer">Cargando contador...</div>
        </div>
    </div>

    <script>
        // Carrusel de imágenes
        const images = document.querySelectorAll('.carousel img');
        let currentIndex = 0;

        setInterval(() => {
            images[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % images.length;
            images[currentIndex].classList.add('active');
        }, 3500);

        // Contador de tiempo juntos (16 de diciembre de 2025)
        const startDate = new Date('2025-12-16T00:00:00');

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) {
                document.getElementById('timer').innerText = "¡Pronto comenzará nuestra historia!";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById('timer').innerText = 
                `${days} días, ${hours} horas, ${minutes} min, ${seconds} seg`;
        }

        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
